<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC Multi</title>
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#262c3a;--t:#e8ecf4;--m:#8791a7;--g:#4ade80;--y:#fbbf24;--r:#f87171;--a:#7c8cff}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fa;--card:#fff;--line:#dde2ee;--t:#161a24;--m:#667089;--a:#4f5fe8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}.w{max-width:1000px;margin:0 auto;padding:22px 14px}
header,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}header{justify-content:space-between}h1{margin:0;font-size:23px}h2{font-size:16px;margin:26px 0 10px;color:var(--m)}
button{background:var(--a);color:#fff;border:0;border-radius:10px;padding:8px 13px;font:inherit;cursor:pointer}button.s{background:transparent;color:var(--t);border:1px solid var(--line)}button.d{background:transparent;color:var(--r);border:1px solid var(--line)}
.box,.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}.c{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;gap:6px;align-items:center}.tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--m)}.m{color:var(--m);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--m);margin-right:6px}.online .dot,.running .dot{background:var(--g);box-shadow:0 0 8px var(--g)}.connecting .dot,.reconnecting .dot,.starting .dot,.downloading .dot{background:var(--y)}.error .dot{background:var(--r)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;transition:.4s}
.code{background:rgba(124,140,255,.12);border:1px dashed var(--a);border-radius:10px;padding:8px;font-size:13px}.code b{font-size:18px;letter-spacing:2px}
dialog{background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(460px,94vw)}dialog::backdrop{background:rgba(0,0,0,.55)}
label{display:block;font-size:13px;color:var(--m);margin:9px 0 3px}input,select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--t);font:inherit}
.chat{height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;font:12.5px monospace;white-space:pre-wrap;margin:8px 0}
.err{color:var(--r);font-size:13px;min-height:16px}#login{text-align:center;padding:90px 0}
</style></head><body><div class="w" id="app"></div>
<dialog id="dlg"></dialog>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,collection,onSnapshot,setDoc,addDoc,deleteDoc,query,where} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp(await (await fetch('./firebase-config.json')).json()),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,9);
let U,acc={},st={},wd={},ws={},meta=null,open=null,pairs=[];
const ST={online:'В сети',offline:'Выключен',connecting:'Подключение…',reconnecting:'Переподключение…',running:'Работает',stopped:'Остановлен',starting:'Запуск…',downloading:'Скачивание…',error:'Ошибка'};
const col=(n)=>collection(db,'users',U,n),dd=(n,id)=>doc(db,'users',U,n,id);
const cmd=o=>addDoc(col('cmds'),o);
$('#app').innerHTML='<div id="login"><h1>⛏ MC Multi</h1><p class="m">Управляй майнкрафт-аккаунтами с любого устройства</p><button id="gl">Войти через Google</button></div>';
$('#gl').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
onAuthStateChanged(auth,u=>{if(!u)return;U=u.uid;
  const sub=(n,f)=>onSnapshot(col(n),s=>{const o={};s.forEach(d=>o[d.id]=d.data());f(o);render()});
  sub('accounts',o=>acc=o);sub('state',o=>st=o);sub('worlds',o=>wd=o);sub('wstate',o=>ws=o);
  onSnapshot(dd('meta','agent'),s=>{meta=s.data();render()});
  onSnapshot(query(collection(db,'pairings'),where('ownerUid','==',U)),s=>{pairs=s.docs.map(d=>d.id);render()});
  setInterval(render,5000)});
const bar=(v,max,c)=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,(v??0)/max*100))}%;background:${c}"></i></div>`;
const tgt=a=>!a.target?'Сервер не выбран':a.target.kind==='world'?'Мир: '+esc(wd[a.target.worldId]?.name||'?'):esc(a.target.host)+(a.target.port?':'+a.target.port:'')+(a.target.version?' · '+esc(a.target.version):'');
function render(){
  if(!U)return;
  if($('#dlg').open&&!$('#dlg').dataset.w){return}
  const on=meta&&Date.now()-meta.t<30000,paired=pairs.length>0;
  $('#app').innerHTML=`<header><h1>⛏ MC Multi</h1><div class="row">${paired?'<button class="d" onclick="unpair()">Отвязать ПК</button>':'<button onclick="pair()">🖥 Подключить ПК</button>'}<button onclick="addAcc()">＋ Аккаунт</button><button class="s" onclick="signOutX()">Выйти</button></div></header>
  <div class="box" style="margin-top:14px"><span class="${on&&paired?'online':''}"><span class="dot"></span></span>${!paired?'ПК не привязан — нажми «Подключить ПК»':on?`ПК привязан и онлайн: ${esc(meta.host)} · ботов ${meta.bots} · память ${meta.mem}/${meta.limit} МБ`:'ПК привязан, но сейчас не на связи (запусти агент)'}</div>
  <h2>АККАУНТЫ</h2><div class="grid">${Object.entries(acc).map(([id,a])=>{const s=st[id]||{status:'offline'};return `<div class="c ${s.status}">
   <div class="top"><b>${esc(a.name)}</b><span class="tag">${a.type=='microsoft'?'Microsoft':'Пиратка'}</span></div>
   <div><span class="dot"></span>${ST[s.status]||s.status} <span class="m">· ${tgt(a)}</span></div>
   ${s.status=='online'?`<div class="m">❤ ${s.health??'?'}/20</div>${bar(s.health,20,'var(--r)')}<div class="m">🍗 ${s.food??'?'}/20</div>${bar(s.food,20,'var(--y)')}`:''}
   ${s.code?`<div class="code">Открой <a style="color:var(--a)" target="_blank" href="${esc(s.code.url)}">${esc(s.code.url)}</a>, введи код<br><b>${esc(s.code.code)}</b></div>`:''}
   <div class="row" style="margin-top:auto">${s.status=='offline'?`<button onclick="go('${id}',1)">▶</button>`:`<button class="s" onclick="go('${id}',0)">■</button>`}
   <button class="s" onclick="win('${id}')">🪟 Окно</button><button class="s" onclick="tg('${id}')">⚙ Сервер</button><button class="d" onclick="delAcc('${id}')">✕</button></div></div>`}).join('')||'<div class="m">Добавь первый аккаунт</div>'}</div>
  <h2>СОЛО-МИРЫ (локальный сервер на ПК)</h2><div class="grid">${Object.entries(wd).map(([id,w])=>{const s=ws[id]?.status||'stopped';return `<div class="c ${s}"><div class="top"><b>${esc(w.name)}</b><span class="tag">${esc(w.version)}</span></div>
   <div><span class="dot"></span>${ST[s]} <span class="m">${esc(ws[id]?.msg)}</span></div><div class="row">${s=='stopped'||s=='error'?`<button onclick="wc('${id}','wstart')">▶</button>`:`<button class="s" onclick="wc('${id}','wstop')">■</button>`}<button class="d" onclick="delW('${id}')">✕</button></div></div>`}).join('')}
   <div class="c"><button class="s" onclick="addW()">＋ Новый мир</button></div></div>`;
  if(open&&$('#dlg').open&&$('#dlg').dataset.w==open){const s=st[open]||{},c=$('#ch');if(c){const bot=c.scrollTop+c.clientHeight>=c.scrollHeight-20;c.textContent=(s.chat||[]).join('\n');if(bot)c.scrollTop=c.scrollHeight;
    $('#wi').innerHTML=`${ST[s.status]||''} · ❤ ${s.health??'?'} · 🍗 ${s.food??'?'}${s.pos?' · 📍 '+s.pos.join(' '):''}${s.dim?' · '+esc(s.dim):''}`}}
}
const D=h=>{$('#dlg').dataset.w='';$('#dlg').innerHTML=h;$('#dlg').showModal()};
Object.assign(window,{
 signOutX:()=>signOut(auth).then(()=>location.reload()),
 unpair:async()=>{if(confirm('Отвязать ПК? Боты на нём остановятся, агент отключится.')){for(const id of pairs)await deleteDoc(doc(db,'pairings',id))}},
 pair:()=>D(`<h3>Подключить ПК</h3><p class="m">Запусти агент на ПК, он покажет ID. Вставь его сюда (один раз, привязка сохраняется навсегда).</p><input id="aid" placeholder="ID агента"><div class="err" id="er"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="s" onclick="dlg.close()">Отмена</button><button onclick="doPair()">Привязать</button></div>`),
 doPair:async()=>{const v=$('#aid').value.trim();if(v.length<20)return $('#er').textContent='Неверный ID';await setDoc(doc(db,'pairings',v),{ownerUid:U});dlg.close()},
 addAcc:()=>D(`<h3>Новый аккаунт</h3><label>Тип</label><select id="ty"><option value="offline">Пиратка (ник)</option><option value="microsoft">Microsoft (вход по коду)</option></select><label>Ник / почта</label><input id="nm"><div class="err" id="er"></div><p class="m">Сервер можно выбрать позже кнопкой ⚙.</p><div class="row" style="justify-content:flex-end"><button class="s" onclick="dlg.close()">Отмена</button><button onclick="doAdd()">Добавить</button></div>`),
 doAdd:async()=>{const n=$('#nm').value.trim(),t=$('#ty').value;if(t=='offline'&&!/^\w{3,16}$/.test(n))return $('#er').textContent='Ник: 3–16 символов, латиница/цифры/_';if(!n)return $('#er').textContent='Введи имя';
  await setDoc(dd('accounts',uid8()),{type:t,name:n,target:null,autostart:false});dlg.close()},
 tg:id=>{const t=acc[id].target||{kind:'server'};D(`<h3>Куда заходит ${esc(acc[id].name)}</h3><select id="k" onchange="kx()"><option value="server">Сервер</option><option value="world">Соло-мир</option></select>
  <div id="sv"><label>Адрес (можно сразу с портом: host:25570)</label><input id="h" value="${esc(t.host)}" placeholder="play.example.com"><div class="row"><div style="flex:1"><label>Порт (пусто = авто)</label><input id="p" value="${esc(t.port||'')}" placeholder="авто" inputmode="numeric"></div><div style="flex:1"><label>Версия (пусто = авто)</label><input id="v" value="${esc(t.version||'')}" placeholder="авто" list="vers"><datalist id="vers"><option value="1.21.11"><option value="1.21.8"><option value="1.21.4"><option value="1.21.1"><option value="1.20.4"><option value="1.20.1"><option value="1.19.4"><option value="1.18.2"><option value="1.17.1"><option value="1.16.5"><option value="1.15.2"><option value="1.14.4"><option value="1.13.2"><option value="1.12.2"><option value="1.8.9"></datalist></div></div></div>
  <div id="wo" style="display:none"><label>Мир</label><select id="wl">${Object.entries(wd).map(([i,w])=>`<option value="${i}">${esc(w.name)}</option>`)}</select></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="s" onclick="dlg.close()">Отмена</button><button onclick="saveT('${id}')">Сохранить</button></div>`);$('#k').value=t.kind;kx()},
 kx:()=>{const w=$('#k').value=='world';$('#sv').style.display=w?'none':'';$('#wo').style.display=w?'':'none'},
 saveT:async id=>{const w=$('#k').value=='world';await setDoc(dd('accounts',id),{...acc[id],target:w?{kind:'world',worldId:$('#wl').value}:{kind:'server',host:$('#h').value.trim(),port:+$('#p').value||null,version:$('#v').value.trim()}});dlg.close()},
 go:async(id,on)=>{await setDoc(dd('accounts',id),{...acc[id],autostart:!!on});cmd({kind:on?'start':'stop',id})},
 delAcc:async id=>{if(confirm('Удалить аккаунт?')){await deleteDoc(dd('accounts',id))}},
 win:id=>{open=id;D(`<div class="top"><h3 style="margin:0">${esc(acc[id].name)}</h3><button class="s" onclick="dlg.close()">✕</button></div><div class="m" id="wi"></div><div class="chat" id="ch"></div>
  <div class="row"><input id="msg" style="flex:1" placeholder="Сообщение или /команда" onkeydown="if(event.key=='Enter')snd('${id}')"><button onclick="snd('${id}')">Отправить</button></div>`);$('#dlg').dataset.w=id;render()},
 snd:id=>{const v=$('#msg').value;if(v){cmd({kind:'chat',id,text:v});$('#msg').value=''}},
 addW:()=>D(`<h3>Новый соло-мир</h3><p class="m">Нужна Java 17/21 на ПК. Лучше версия 1.20+. Сервер скачается с Mojang, запуская его, ты принимаешь <a style="color:var(--a)" target="_blank" href="https://aka.ms/MinecraftEULA">EULA</a>.</p><label>Название</label><input id="wn" value="Мой мир"><label>Версия</label><input id="wv" value="1.20.4"><label>Порт</label><input id="wp" value="25570"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="s" onclick="dlg.close()">Отмена</button><button onclick="doW()">Создать (принимаю EULA)</button></div>`),
 doW:async()=>{await setDoc(dd('worlds',uid8()),{name:$('#wn').value,version:$('#wv').value.trim(),port:+$('#wp').value||25570});dlg.close()},
 wc:(id,kind)=>cmd({kind,id}),delW:async id=>{if(confirm('Удалить мир из списка? Файлы мира на ПК останутся.'))await deleteDoc(doc(db,'users',U,'worlds',id))}
});
</script></body></html>
